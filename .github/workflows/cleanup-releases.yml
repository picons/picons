name: Cleanup Old Releases

on:
  workflow_dispatch:      # manual trigger button in the Actions tab
  schedule:
    - cron: '0 3 * * 1'   # runs every Monday at 03:00 UTC

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    if: github.repository == 'picons/picons' || github.event_name == 'workflow_dispatch'
    steps:
      - name: Delete old releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          KEEP_COUNT: 9
          KEEP_CHANNELLIST_COUNT: 2
          KEEP_SPECIFIC_TAG: "2025-10-11--01-02-12"
        run: |
          REPO="${{ github.repository }}"

          ALL_TAGS=$(gh release list --repo "$REPO" --json tagName -q '.[].tagName' --limit 5000)

          # Plain releases: everything NOT starting with "channellists-"
          PLAIN_TAGS=$(echo "$ALL_TAGS" | grep -v '^channellists-')
          KEEP_PLAIN=$(echo "$PLAIN_TAGS" | head -n "$KEEP_COUNT")

          # Ziggo channellist releases
          ZIGGO_TAGS=$(echo "$ALL_TAGS" | grep '^channellists-ziggo-')
          KEEP_ZIGGO=$(echo "$ZIGGO_TAGS" | head -n "$KEEP_CHANNELLIST_COUNT")

          # 13e.19e.23e.28e channellist releases
          C13E_TAGS=$(echo "$ALL_TAGS" | grep '^channellists-13e19e23e28e-')
          KEEP_C13E=$(echo "$C13E_TAGS" | head -n "$KEEP_CHANNELLIST_COUNT")

          KEEP_TAGS=$(printf '%s\n%s\n%s\n%s\n' "$KEEP_PLAIN" "$KEEP_ZIGGO" "$KEEP_C13E" "$KEEP_SPECIFIC_TAG")

          for tag in $ALL_TAGS; do
            if echo "$KEEP_TAGS" | grep -qx "$tag"; then
              echo "Keeping $tag"
            else
              echo "Deleting $tag"
              gh release delete "$tag" --repo "$REPO" -y --cleanup-tag
            fi
          done

      - name: Delete orphan tags (no release attached)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          KEEP_SPECIFIC_TAG: "2025-10-11--01-02-12"
        run: |
          REPO="${{ github.repository }}"

          # Tags that still have a Release object (what the step above works from)
          RELEASED_TAGS=$(gh release list --repo "$REPO" --json tagName -q '.[].tagName' --limit 5000)

          # Every git tag ref in the repo, regardless of whether it has a Release
          ALL_GIT_TAGS=$(gh api "repos/$REPO/git/refs/tags" --paginate -q '.[].ref' | sed 's#refs/tags/##')

          # Tags present as git refs but with no matching Release - these are invisible
          # to "gh release list" (e.g. a Release deleted via the web UI without
          # --cleanup-tag, or an old tag from before Releases were used) and would
          # otherwise never be cleaned up no matter how many times this workflow runs.
          ORPHAN_TAGS=$(comm -23 <(echo "$ALL_GIT_TAGS" | sort) <(echo "$RELEASED_TAGS" | sort))

          for tag in $ORPHAN_TAGS; do
            if [ "$tag" = "$KEEP_SPECIFIC_TAG" ]; then
              echo "Keeping orphan tag $tag (pinned)"
              continue
            fi
            echo "Deleting orphan tag (no release) $tag"
            gh api -X DELETE "repos/$REPO/git/refs/tags/$tag"
          done

      - name: List remaining tags
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          REPO="${{ github.repository }}"
          REMAINING_RELEASE_TAGS=$(gh release list --repo "$REPO" --json tagName -q '.[].tagName' --limit 5000)
          REMAINING_GIT_TAGS=$(gh api "repos/$REPO/git/refs/tags" --paginate -q '.[].ref' | sed 's#refs/tags/##')

          echo "## Remaining tags" >> "$GITHUB_STEP_SUMMARY"
          echo "- With a release: $(echo "$REMAINING_RELEASE_TAGS" | grep -c .)" >> "$GITHUB_STEP_SUMMARY"
          echo "- Total git tags: $(echo "$REMAINING_GIT_TAGS" | grep -c .)" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "$REMAINING_GIT_TAGS" | sort >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
